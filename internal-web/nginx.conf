# HTTPS 만 받는다. 인증서는 privacygate/infra/secrets/tls (init-env.sh 가 생성, Git 제외)
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더: 외부 스크립트·프레임 삽입 차단
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 화면 파일을 고치면 바로 반영되도록 (브라우저가 매번 서버에 변경 여부 확인)
    add_header Cache-Control "no-cache" always;

    # 화면에서 쓰는 API 와 로그인은 internal-api 로 전달 (브라우저는 internal-api 에 직접 닿지 않음)
    location /api/ {
        proxy_pass http://internal-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://internal-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
